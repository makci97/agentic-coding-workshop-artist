<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            background: #1a1a1a;
        }
        canvas {
            display: block;
            background: #ffffff;
        }
        /* Connection Indicator */
        .connection-indicator {
            position: absolute;
            bottom: 10px;
            left: 10px;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .connection-indicator::before {
            content: '';
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: currentColor;
        }
        .connection-indicator.connected {
            background: #1b5e20;
            color: #4caf50;
        }
        .connection-indicator.disconnected {
            background: #b71c1c;
            color: #ef5350;
        }
        .connection-indicator.reconnecting {
            background: #f57f17;
            color: #ffb74d;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        /* Error Message Display */
        .error-display {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(183, 28, 28, 0.95);
            color: #fff;
            padding: 16px 24px;
            border-radius: 8px;
            font-size: 14px;
            max-width: 400px;
            text-align: center;
            z-index: 2000;
            display: none;
        }
        .error-display.show {
            display: block;
        }
        .error-display h3 {
            margin-bottom: 8px;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <!-- Connection Indicator -->
    <div class="connection-indicator disconnected" id="connectionIndicator">
        <span id="connectionStatus">Disconnected</span>
    </div>

    <!-- Error Message Display -->
    <div class="error-display" id="errorDisplay">
        <h3>Error</h3>
        <p id="errorMessage"></p>
    </div>

    <script>
        // Configuration
        const DEFAULT_WS_URL = 'ws://195.133.25.57/canvas/ws';
        const HTTP_BASE_URL = 'http://195.133.25.57';

        function getWebSocketUrl() {
            const params = new URLSearchParams(window.location.search);
            const wsParam = params.get('ws');
            if (wsParam) {
                // Validate WebSocket URL
                if (wsParam.startsWith('ws://') || wsParam.startsWith('wss://')) {
                    return wsParam;
                }
            }
            return DEFAULT_WS_URL;
        }

        function getHttpBaseUrl() {
            const params = new URLSearchParams(window.location.search);
            const httpParam = params.get('http');
            if (httpParam) {
                return httpParam;
            }
            return HTTP_BASE_URL;
        }

        // State
        const strokes = [];
        let ws = null;
        let canvasWidth = 800;
        let canvasHeight = 600;
        let reconnectAttempts = 0;
        const MAX_RECONNECT_DELAY = 30000; // 30 seconds

        // DOM elements
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const connectionIndicator = document.getElementById('connectionIndicator');
        const connectionStatus = document.getElementById('connectionStatus');
        const errorDisplay = document.getElementById('errorDisplay');
        const errorMessage = document.getElementById('errorMessage');

        // Initialize canvas size
        function initCanvasSize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        // Update connection status indicator
        function updateConnectionStatus(status) {
            connectionIndicator.className = 'connection-indicator ' + status;
            switch (status) {
                case 'connected':
                    connectionStatus.textContent = 'Connected';
                    hideError();
                    break;
                case 'disconnected':
                    connectionStatus.textContent = 'Disconnected';
                    break;
                case 'reconnecting':
                    connectionStatus.textContent = 'Reconnecting... (' + reconnectAttempts + ')';
                    break;
            }
        }

        // Show error message
        function showError(message) {
            errorMessage.textContent = message;
            errorDisplay.classList.add('show');
            // Auto-hide after 5 seconds
            setTimeout(hideError, 5000);
        }

        // Hide error message
        function hideError() {
            errorDisplay.classList.remove('show');
        }

        // Calculate reconnect delay with exponential backoff
        function getReconnectDelay() {
            const delay = Math.min(1000 * Math.pow(2, reconnectAttempts), MAX_RECONNECT_DELAY);
            return delay + Math.random() * 1000; // Add jitter
        }

        // Fetch canvas config from server
        async function fetchCanvasConfig() {
            try {
                const httpUrl = getHttpBaseUrl();
                const response = await fetch(`${httpUrl}/canvas/config`);
                if (response.ok) {
                    const config = await response.json();
                    canvasWidth = config.width;
                    canvasHeight = config.height;
                    canvas.width = canvasWidth;
                    canvas.height = canvasHeight;
                    console.log(`Canvas config: ${canvasWidth}x${canvasHeight}`);
                }
            } catch (error) {
                console.warn('Failed to fetch canvas config, using window size:', error);
                initCanvasSize();
            }
        }

        // Draw a single stroke
        function drawStroke(stroke) {
            ctx.beginPath();
            ctx.moveTo(stroke.x1, stroke.y1);
            ctx.lineTo(stroke.x2, stroke.y2);
            ctx.strokeStyle = stroke.color;
            ctx.lineWidth = stroke.w;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.stroke();
        }

        // Render all visible strokes
        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (const stroke of strokes) {
                drawStroke(stroke);
            }
        }

        // Process incoming strokes
        function processStrokes(newStrokes) {
            for (const stroke of newStrokes) {
                // Check if stroke already exists
                const exists = strokes.some(s =>
                    s.x1 === stroke.x1 && s.y1 === stroke.y1 &&
                    s.x2 === stroke.x2 && s.y2 === stroke.y2 &&
                    s.color === stroke.color && s.w === stroke.w
                );
                if (!exists) {
                    strokes.push(stroke);
                }
            }
            render();
        }

        // WebSocket connection
        function connect() {
            const wsUrl = getWebSocketUrl();
            console.log('Connecting to WebSocket:', wsUrl);

            ws = new WebSocket(wsUrl);

            ws.onopen = function(event) {
                console.log('WebSocket connected');
                reconnectAttempts = 0; // Reset on successful connection
                updateConnectionStatus('connected');
            };

            ws.onmessage = function(event) {
                try {
                    const message = JSON.parse(event.data);

                    switch (message.type) {
                        case 'open':
                            console.log('Canvas opened:', message.canvas);
                            if (message.canvas) {
                                canvasWidth = message.canvas.width;
                                canvasHeight = message.canvas.height;
                                canvas.width = canvasWidth;
                                canvas.height = canvasHeight;
                            }
                            break;

                        case 'snapshot':
                            console.log('Received snapshot with', message.strokes?.length, 'strokes');
                            strokes.length = 0; // Clear existing
                            if (message.strokes) {
                                processStrokes(message.strokes);
                            }
                            break;

                        case 'delta':
                            console.log('Received delta with', message.strokes?.length, 'strokes');
                            if (message.strokes) {
                                processStrokes(message.strokes);
                            }
                            break;

                        case 'clear':
                            console.log('Canvas cleared');
                            strokes.length = 0;
                            render();
                            break;

                        case 'error':
                            console.error('Server error:', message.error);
                            showError('Server error: ' + message.error);
                            break;

                        default:
                            console.log('Unknown message type:', message.type);
                    }
                } catch (error) {
                    console.error('Failed to parse message:', error);
                }
            };

            ws.onclose = function(event) {
                console.log('WebSocket closed, reconnecting...');
                updateConnectionStatus('disconnected');
                reconnectAttempts++;
                updateConnectionStatus('reconnecting');
                const delay = getReconnectDelay();
                console.log('Reconnect attempt ' + reconnectAttempts + ' in ' + Math.round(delay) + 'ms');
                setTimeout(connect, delay);
            };

            ws.onerror = function(error) {
                console.error('WebSocket error:', error);
                updateConnectionStatus('disconnected');
            };
        }

        // Handle window resize
        window.addEventListener('resize', () => {
            // Keep canvas size fixed based on server config
            // But scale display if needed
        });

        // Initialize
        async function init() {
            await fetchCanvasConfig();
            connect();
        }

        init();
    </script>
</body>
</html>
